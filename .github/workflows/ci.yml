name: FIFO simulation
on:
  push:
  pull_request:
jobs:
  verilator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Verilator
        run: sudo apt-get update && sudo apt-get install -y verilator make g++
      - name: Run self-checking testbench
        run: make test
